name: Publish portfolio
on:
  push:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    # Weekly wake-up; the cadence job skips alternate weeks.
    - cron: '17 3 * * 5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        # Manual runs and pushes never wait for the fortnightly schedule.
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, date, timezone
          days = (datetime.now(timezone.utc).date() - date(2026, 10, 30)).days
          due = days % 14 < 7
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'deploy={str(due).lower()}', file=output)
          PY
  deploy:
    needs: cadence
    if: github.event_name != 'schedule' || needs.cadence.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Hashnode articles
        run: python3 scripts/fetch_hashnode.py
      - name: Build writing list
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp *.html _site/
          cp -R assets _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
